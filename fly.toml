# Alternativa a Render: fly launch --no-deploy --copy-config && fly volumes create fieldshift_data --size 1 && fly deploy
app = "fieldshift"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/var/data/fieldshift.db"
  CORS_ORIGINS = "*"
  SCHEDULER = "on"
  SCHEDULER_HORA = "06:00"
  TZ = "America/Guatemala"
  # Secretos (nunca aquí): fly secrets set PUBLIC_URL=... WEB_URL=... ADMIN_TOKEN=... WHATSAPP_TOKEN=... (ver docs/deploy.md)

[mounts]
  source = "fieldshift_data"
  destination = "/var/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # el scheduler de alertas necesita la máquina encendida
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# Chromium (video del sandbox, informe PDF) necesita ~1 GB.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
