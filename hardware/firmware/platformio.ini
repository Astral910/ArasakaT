; FieldShift · estación de campo (humedad del suelo + lluvia)
; Compilar:  pio run -e esp32c3        (nodo principal, ESP32-C3 SuperMini / DevKitM-1)
;            pio run -e esp32s3        (nodo alternativo o puerta de enlace)
;            pio run -e esp32dev       (ESP32 clásico, "ESP32 D")
; Subir:     pio run -e esp32c3 -t upload ; monitor: pio device monitor -b 115200

[env]
platform = espressif32 @ 6.9.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    tzapu/WiFiManager @ 2.0.17
    bblanchon/ArduinoJson @ 7.2.1
    paulstoffregen/OneWire @ 2.3.8
    milesburton/DallasTemperature @ 3.11.0
    adafruit/Adafruit SHT31 Library @ 2.2.2
build_flags =
    -DFS_FW_VERSION=\"0.1.0\"

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DFS_PLACA_C3=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DFS_PLACA_S3=1

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DFS_PLACA_CLASICO=1
