<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880" font-family="Figtree, system-ui, sans-serif">
<rect width="100%" height="100%" fill="#f5efe4"/>
<text x="40" y="52" font-family="Fraunces, Georgia, serif" font-size="30" font-weight="600" fill="#2a2118">Estación de campo FieldShift · cableado del nodo ESP32-C3</text>
<text x="40" y="80" font-size="15" fill="#7d6a58">Sensores alimentados solo al medir (P-MOSFET) · deep sleep 15 min · el reed del pluviómetro despierta al chip · analógicos solo en ADC1</text>
<rect x="40" y="120" width="200" height="92" rx="12" fill="#e8eef7" stroke="#57473a" stroke-width="1.6"/>
<text x="140.0" y="144" text-anchor="middle" font-size="16" font-weight="700" fill="#2a2118">Panel solar 6 V</text>
<text x="140.0" y="164" text-anchor="middle" font-size="12.5" fill="#57473a">1–2 W · inclinado ≈ latitud (≥ 15°)</text>
<text x="140.0" y="181" text-anchor="middle" font-size="12.5" fill="#57473a">mirando al ecuador</text>
<rect x="40" y="290" width="200" height="110" rx="12" fill="#fffaf2" stroke="#57473a" stroke-width="1.6"/>
<text x="140.0" y="314" text-anchor="middle" font-size="16" font-weight="700" fill="#2a2118">Cargador CN3065</text>
<text x="140.0" y="334" text-anchor="middle" font-size="12.5" fill="#57473a">(o TP4056 con DW01)</text>
<text x="140.0" y="351" text-anchor="middle" font-size="12.5" fill="#57473a">IN+/IN− ← panel</text>
<text x="140.0" y="368" text-anchor="middle" font-size="12.5" fill="#57473a">BAT+/BAT− → 18650</text>
<rect x="40" y="480" width="200" height="92" rx="12" fill="#fffaf2" stroke="#57473a" stroke-width="1.6"/>
<text x="140.0" y="504" text-anchor="middle" font-size="16" font-weight="700" fill="#2a2118">Batería 18650</text>
<text x="140.0" y="524" text-anchor="middle" font-size="12.5" fill="#57473a">3,0–4,2 V · con protección</text>
<text x="140.0" y="541" text-anchor="middle" font-size="12.5" fill="#57473a">2 500–3 500 mAh</text>
<rect x="320" y="290" width="180" height="110" rx="12" fill="#fffaf2" stroke="#57473a" stroke-width="1.6"/>
<text x="410.0" y="314" text-anchor="middle" font-size="16" font-weight="700" fill="#2a2118">LDO 3,3 V</text>
<text x="410.0" y="334" text-anchor="middle" font-size="12.5" fill="#57473a">RT9080-33 (Iq ≈ 2 µA)</text>
<text x="410.0" y="351" text-anchor="middle" font-size="12.5" fill="#57473a">o HT7333 + 470 µF</text>
<text x="410.0" y="368" text-anchor="middle" font-size="12.5" fill="#57473a">VIN ← BAT+ · VOUT → 3V3</text>
